# 静的アセットのキャッシュ設定
#
# WordPress が自動管理する .htaccess の
#   # BEGIN WordPress 〜 # END WordPress
# の範囲の「外側」に追記する。範囲内に書くと
# パーマリンク設定の保存時に消える。
#
# アセットの URL には filemtime 由来の ?ver= が付くため、
# 長いキャッシュ期間でも更新は即座に反映される。
#
# 適用:
#   docker exec -i portfolio_wp sh -c 'cat >> /var/www/html/.htaccess' < config/htaccess-cache.conf
#   docker exec portfolio_wp sh -c 'a2enmod expires headers && apache2ctl graceful'

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css                  "access plus 1 year"
  ExpiresByType application/javascript    "access plus 1 year"
  ExpiresByType font/woff2                "access plus 1 year"
  ExpiresByType image/png                 "access plus 1 month"
  ExpiresByType image/jpeg                "access plus 1 month"
  ExpiresByType image/svg+xml             "access plus 1 month"
  ExpiresByType image/webp                "access plus 1 month"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(css|js|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
</IfModule>
